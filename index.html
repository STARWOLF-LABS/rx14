<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#090704">
<link rel="manifest" href="manifest.webmanifest">
<title>STARWOLF RX-14 // v0.3</title>
<style>
:root{--a:#ffb43b;--a2:#ffd27a;--dim:#9d6722;--line:rgba(255,180,59,.28)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020100;color:var(--a);font-family:"Courier New",monospace}
body{display:flex;justify-content:center}
#crt{position:relative;width:100vw;height:100dvh;max-width:620px;overflow:hidden;background:radial-gradient(ellipse at center,rgba(255,151,26,.055),transparent 63%),linear-gradient(#0d0904,#050301);padding:max(18px,env(safe-area-inset-top)) 15px max(14px,env(safe-area-inset-bottom));text-shadow:0 0 5px rgba(255,180,59,.8),0 0 12px rgba(255,133,0,.25)}
#crt:before{content:"";position:absolute;inset:0;z-index:20;pointer-events:none;background:repeating-linear-gradient(to bottom,rgba(255,255,255,.02) 0,rgba(255,255,255,.02) 1px,rgba(0,0,0,.14) 2px,rgba(0,0,0,.14) 4px);mix-blend-mode:screen}
#crt:after{content:"";position:absolute;inset:-10%;z-index:21;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.64) 100%)}
#boot{position:absolute;inset:0;padding:40px 24px;z-index:10;background:#070401;white-space:pre-wrap;font-size:13px;line-height:1.55}
#radio{height:100%;display:none;flex-direction:column;gap:7px;position:relative;z-index:3}
.top{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:6px}.brand{font-weight:bold;letter-spacing:1.5px;font-size:14px}.sub,.status{font-size:8px;letter-spacing:1.5px;color:var(--a2);line-height:1.5}.status{text-align:right}
.bandbar{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}.bandbar button{padding:8px 1px;font-size:7px}.bandbar button.active{background:#382006;color:#ffe0a1;box-shadow:inset 0 0 12px rgba(255,180,59,.18),0 0 8px rgba(255,180,59,.12)}
.scope{position:relative;height:20vh;min-height:100px;border:1px solid var(--line);background:linear-gradient(rgba(255,180,59,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,180,59,.05) 1px,transparent 1px),#070401;background-size:100% 25%,12.5% 100%;overflow:hidden}
canvas{width:100%;height:100%;display:block}.sweep{position:absolute;top:0;bottom:0;width:2px;background:var(--a2);box-shadow:0 0 12px 3px rgba(255,180,59,.45);opacity:.5;animation:sweep 4s linear infinite}@keyframes sweep{from{left:-2%}to{left:102%}}
.readout{text-align:center}.memory{font-size:9px;letter-spacing:2px;color:var(--dim)}.location{font-size:clamp(22px,7vw,36px);font-weight:bold;letter-spacing:1px;color:var(--a2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.station{font-size:10px;letter-spacing:1.2px;margin-top:1px}.signal{font-size:9px;letter-spacing:1.5px;margin-top:4px}.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--a);box-shadow:0 0 9px var(--a);margin-right:6px}
.water{height:13vh;min-height:65px;border:1px solid var(--line);background:#050301}
.telemetry{display:flex;justify-content:space-between;font-size:7px;letter-spacing:1px;color:var(--dim)}
.controls{display:grid;grid-template-columns:1.15fr 1.25fr 1fr;gap:6px;margin-top:auto}button{appearance:none;border:1px solid rgba(255,180,59,.46);border-radius:2px;background:#130c05;color:var(--a);font:700 9px "Courier New",monospace;letter-spacing:.7px;padding:10px 4px;text-shadow:0 0 5px rgba(255,180,59,.65)}button:active{background:#2b1907;transform:translateY(1px)}.tune{display:flex;gap:5px}.tune button{flex:1;font-size:17px;padding:7px}
.footer{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding-top:5px;font-size:7px;color:var(--dim)}
#message{position:absolute;left:50%;top:47%;transform:translate(-50%,-50%);border:1px solid var(--line);background:rgba(6,3,1,.95);padding:12px 16px;font-size:9px;letter-spacing:1.5px;z-index:15;display:none;text-align:center;min-width:72%}
.ghostPulse{animation:ghostPulse 5.2s infinite}@keyframes ghostPulse{0%,47%,49%,78%,80%,100%{opacity:1}48%{opacity:.78}79%{opacity:.9}}
@media(max-height:650px){.scope{height:17vh}.water{height:10vh}.bandbar button{padding:6px 1px}.location{font-size:24px}}

.starwolf-badge{
  width:min(62vw,340px);
  margin:38px auto 34px;
  color:var(--amber);
  opacity:.34;
  filter:drop-shadow(0 0 3px rgba(255,177,59,.32));
  pointer-events:none;
  user-select:none;
}
.starwolf-badge svg{display:block;width:100%;height:auto;overflow:visible}
.starwolf-badge .sw-word{
  font-family:inherit;
  font-size:34px;
  font-weight:700;
  letter-spacing:8px;
}
@media (max-width:600px){
  .starwolf-badge{
    width:54vw;
    max-width:270px;
    margin:34px auto 30px;
    opacity:.38;
  }
  .starwolf-badge .sw-word{font-size:31px;letter-spacing:7px}
}

</style></head>
<body>
<div id="crt"><div id="boot"></div><div id="message"></div>
<div id="radio">
<div class="top"><div><div class="brand">STARWOLF LABS // RX-14</div><div class="sub">WORLD-BAND FIELD RECEIVER // v0.51</div></div><div class="status">NEW MANILA<br>UNIT 01<br><span id="clock">--:--:--</span></div></div>
<div class="bandbar" id="bands"></div>
<div class="scope"><canvas id="spectrum"></canvas><div class="sweep"></div></div>
<div class="readout"><div class="memory" id="memory"></div><div class="location" id="location"></div><div class="station" id="station"></div><div class="signal"><span class="dot"></span><span id="sig"></span></div></div>
<canvas class="water" id="water"></canvas>
<div class="telemetry"><span id="genre"></span><span id="range"></span></div>

<div class="starwolf-badge" aria-label="Starwolf Labs">
  <svg viewBox="0 0 760 300" role="img" aria-hidden="true">
    <g fill="none" stroke="currentColor" stroke-width="12" stroke-linejoin="miter" stroke-linecap="square">
      <!-- broken moon -->
      <path d="M174 132 A104 104 0 0 1 346 64"/>
      <path d="M177 170 A104 104 0 0 0 282 260"/>
      <!-- four-point star -->
      <path d="M56 158 L232 145 L247 42 L261 145 L404 158 L261 171 L247 274 L232 171 Z" fill="currentColor" stroke="none"/>
      <!-- angular wolf -->
      <path d="M304 128 L402 48 L444 91 L492 34 L501 103 L570 126 L642 173 L610 208 L546 218 L505 202 L529 252 L474 252 L427 190 L384 190 L432 252 L382 252 L326 181 L280 181"/>
      <path d="M402 48 L417 115 L369 129"/>
      <path d="M501 103 L469 139 L505 158"/>
      <path d="M531 143 L570 154 L548 169 Z" fill="currentColor" stroke="none"/>
      <path d="M619 174 L635 181 L621 191 Z" fill="currentColor" stroke="none"/>
    </g>
    <g fill="currentColor" text-anchor="middle">
      <text x="380" y="286" class="sw-word">STARWOLF LABS</text>
    </g>
  </svg>
</div>

<div class="controls"><button id="listen">▶ TUNE IN</button><div class="tune"><button id="prev">◀</button><button id="next">▶</button></div><button id="scan">SCAN BANK</button></div>
<div class="footer"><span>RF FRONT END // HYBRID</span><span>PHOS // AMBER</span><span>SWL-1983</span></div>
<audio id="audio" playsinline></audio>
</div></div>
<script src="stations.js"></script>
<script>
const labels=["NEON","GHOST","TEZETA","WORLD","QUANTUM"], prefix={NEON:"A",GHOST:"B",TEZETA:"C",WORLD:"D",QUANTUM:"E"};
let band="NEON",idx=0,playing=false; const $=id=>document.getElementById(id), audio=$("audio");
labels.forEach(b=>{let x=document.createElement("button");x.textContent=b;x.onclick=()=>selectBand(b);$("bands").appendChild(x)});
function stop(){audio.pause();audio.removeAttribute("src");audio.load();playing=false;$("listen").textContent="ACQUIRE SIGNAL"}
function selectBand(b){stop();band=b;idx=0;document.querySelectorAll(".bandbar button").forEach((x,i)=>x.classList.toggle("active",labels[i]===b));$("crt").classList.toggle("ghostPulse",b==="GHOST");render();flash(b==="GHOST"?"GHOST BAND // ARCHIVAL CARRIER":b+" BAND // MEMORY ONLINE")}
function render(){let s=BANKS[band][idx];$("memory").textContent=`MEMORY ${prefix[band]}${String(idx+1).padStart(2,"0")} // ${band}`;$("location").textContent=s.loc;$("station").textContent=s.name;$("genre").textContent=s.genre;$("sig").textContent=s.offline?"NO CARRIER // SEARCHING ARCHIVES":(band==="GHOST"?"AGED CARRIER // SIGNAL UNSTABLE":"CARRIER LOCKED // TRANSFER READY");$("range").textContent=s.offline?"NO CARRIER":"EXTERNAL TRANSFER"}
function flash(t){$("message").innerHTML=t+"<br><br>▓▓▓▓▓░░<br>ACQUIRING CARRIER...";$("message").style.display="block";setTimeout(()=>$("message").style.display="none",850)}
function step(n){stop();idx=(idx+n+BANKS[band].length)%BANKS[band].length;render();flash("TUNING MEMORY")}
$("prev").onclick=()=>step(-1);$("next").onclick=()=>step(1);
$("scan").onclick=()=>{stop();flash("SCANNING "+band+" BANK");setTimeout(()=>{idx=(idx+1)%BANKS[band].length;render()},650)};
$("listen").onclick=async()=>{let s=BANKS[band][idx];if(playing){stop();$("sig").textContent=s.mode==="direct"?"DIRECT CARRIER // READY":"TRANSFER CARRIER // READY";return}if(s.mode==="direct"&&s.stream){$("sig").textContent="ACQUIRING SIGNAL...";flash("ACQUIRING SIGNAL...");audio.src=s.stream;audio.preload="none";try{await audio.play();playing=true;$("listen").textContent="■ END SIGNAL";$("sig").textContent="● SIGNAL ACQUIRED // LIVE AUDIO"}catch(e){playing=false;$("listen").textContent="▶ TUNE IN";$("sig").textContent="DIRECT CARRIER FAILED // TRANSFER AVAILABLE";transferFlash(["DIRECT CARRIER FAILED","STAND BY FOR TRANSFER"],()=>window.location.href=s.url)}}else{transferFlash(["HANDSHAKE...","ROUTING AUDIO CARRIER...","SIGNAL ACQUIRED","STAND BY FOR TRANSFER"],()=>window.location.href=s.url)}};
function transferFlash(lines,done){let box=$("message"),i=0;box.style.display="block";function show(){box.innerHTML=lines.slice(0,i+1).join("<br><br>");i++;if(i<lines.length)setTimeout(show,420);else setTimeout(()=>{box.style.display="none";if(done)done()},600)}show();}
setInterval(()=>$("clock").textContent=new Date().toLocaleTimeString([],{hour12:false}),1000);

const sp=$("spectrum"),sx=sp.getContext("2d"),wa=$("water"),wx=wa.getContext("2d");let phase=0;
function resize(){[sp,wa].forEach(c=>{let r=c.getBoundingClientRect();c.width=Math.max(1,r.width*devicePixelRatio);c.height=Math.max(1,r.height*devicePixelRatio)})}addEventListener("resize",resize);
function draw(){let w=sp.width,h=sp.height;sx.clearRect(0,0,w,h);sx.strokeStyle="#ffb43b";sx.lineWidth=1.3*devicePixelRatio;sx.shadowColor="#ff9a24";sx.shadowBlur=band==="GHOST"?10:6;sx.beginPath();for(let x=0;x<w;x+=3*devicePixelRatio){let jitter=band==="GHOST"?.06:.025,energy=playing?.08:0;let base=.72+jitter*Math.sin(x*.025+phase)+jitter*Math.random()-energy*Math.abs(Math.sin(phase*3+x*.01));let strength=band==="NEON"?.5:band==="GHOST"?.34:band==="TEZETA"?.42:band==="QUANTUM"?.22:.38;let p1=strength*Math.exp(-Math.pow((x-w*.31)/(w*.025),2)),p2=(strength+.08)*Math.exp(-Math.pow((x-w*.62)/(w*.02),2)),p3=strength*.55*Math.exp(-Math.pow((x-w*.81)/(w*.04),2));let y=h*Math.max(.1,base-p1-p2-p3);x===0?sx.moveTo(x,y):sx.lineTo(x,y)}sx.stroke();phase+=playing?.075:.04;requestAnimationFrame(draw)}
function waterfall(){let w=wa.width,h=wa.height;wx.drawImage(wa,0,0,w,h,0,1*devicePixelRatio,w,h);wx.fillStyle="#070401";wx.fillRect(0,0,w,2*devicePixelRatio);for(let x=0;x<w;x+=2*devicePixelRatio){let a=.04+Math.random()*(band==="GHOST"?.2:.1)+(playing?.08:0);[.31,.62,.81].forEach(p=>a+=(band==="GHOST"?.34:.55)*Math.exp(-Math.pow((x/w-p)/.027,2)));wx.fillStyle=`rgba(255,170,45,${Math.min(.85,a)})`;wx.fillRect(x,0,2*devicePixelRatio,2*devicePixelRatio)}setTimeout(waterfall,band==="GHOST"?105:70)}
const bootLines=["STARWOLF LABORATORIES","MOBILE SIGNAL DIVISION","","RX-14 WORLD-BAND RECEIVER // v0.51","ROM CHECK..............OK","DISPLAY................OK","AUDIO BUS..............OK","MEMORY BANK............OK","ARCHIVE LINK...........OK","","LOCATION: NEW MANILA // SECTOR 03","","RESTORING SIGNAL MEMORIES...","NEON...................ONLINE","GHOST..................ONLINE","TEZETA..................ONLINE","WORLD...................ONLINE","QUANTUM.................ONLINE","","> RECEIVER READY"];let bi=0;
function bootNext(){if(bi<bootLines.length){$("boot").innerHTML+=bootLines[bi++]+"\n";setTimeout(bootNext,80+Math.random()*90)}else setTimeout(()=>{$("boot").style.display="none";$("radio").style.display="flex";resize();selectBand("NEON")},450)}
$("boot").innerHTML="▮\n";setTimeout(()=>{$("boot").innerHTML="";bootNext()},300);resize();draw();waterfall();
</script></body></html>
