<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#090704">
<link rel="manifest" href="manifest.webmanifest">
<title>STARWOLF RX-14 // v0.7</title>
<style>
:root{--a:#ffb43b;--a2:#ffd27a;--dim:#9d6722;--line:rgba(255,180,59,.28)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020100;color:var(--a);font-family:"Courier New",monospace}
body{display:flex;justify-content:center}
#crt{position:relative;width:100vw;height:100dvh;max-width:620px;overflow:hidden;background:radial-gradient(ellipse at center,rgba(255,151,26,.055),transparent 63%),linear-gradient(#0d0904,#050301);padding:max(18px,env(safe-area-inset-top)) 15px max(14px,env(safe-area-inset-bottom));text-shadow:0 0 5px rgba(255,180,59,.8),0 0 12px rgba(255,133,0,.25)}
#crt:before{content:"";position:absolute;inset:0;z-index:20;pointer-events:none;background:repeating-linear-gradient(to bottom,rgba(255,255,255,.02) 0,rgba(255,255,255,.02) 1px,rgba(0,0,0,.14) 2px,rgba(0,0,0,.14) 4px);mix-blend-mode:screen}
#crt:after{content:"";position:absolute;inset:-10%;z-index:21;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.64) 100%)}
#boot{position:absolute;inset:0;padding:40px 24px;z-index:10;background:#070401;white-space:pre-wrap;font-size:13px;line-height:1.55}
#radio{height:100%;display:none;flex-direction:column;gap:7px;position:relative;z-index:3}
.top{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:6px}.brand{font-weight:bold;letter-spacing:1.5px;font-size:14px}.sub,.status{font-size:8px;letter-spacing:1.5px;color:var(--a2);line-height:1.5}.status{text-align:right}
.bandbar{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.bandbar button{min-height:44px;padding:7px 2px;font-size:9px;line-height:1.05;letter-spacing:.5px;white-space:normal}.bandbar button.active{background:#382006;color:#ffe0a1;box-shadow:inset 0 0 12px rgba(255,180,59,.18),0 0 8px rgba(255,180,59,.12)}
.scope{position:relative;height:20vh;min-height:100px;border:1px solid var(--line);background:linear-gradient(rgba(255,180,59,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,180,59,.05) 1px,transparent 1px),#070401;background-size:100% 25%,12.5% 100%;overflow:hidden}
canvas{width:100%;height:100%;display:block}.sweep{position:absolute;top:0;bottom:0;width:2px;background:var(--a2);box-shadow:0 0 12px 3px rgba(255,180,59,.45);opacity:.5;animation:sweep 4s linear infinite}@keyframes sweep{from{left:-2%}to{left:102%}}
.readout{text-align:center}.memory{font-size:9px;letter-spacing:2px;color:var(--dim)}.location{font-size:clamp(22px,7vw,36px);font-weight:bold;letter-spacing:1px;color:var(--a2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.station{font-size:10px;letter-spacing:1.2px;margin-top:1px}.signal{font-size:9px;letter-spacing:1.5px;margin-top:4px}.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--a);box-shadow:0 0 9px var(--a);margin-right:6px}
.water{height:13vh;min-height:65px;border:1px solid var(--line);background:#050301}
.telemetry{display:flex;justify-content:space-between;font-size:7px;letter-spacing:1px;color:var(--dim)}
.controls{display:grid;grid-template-columns:1.15fr 1.25fr 1fr;gap:6px;margin-top:auto}button{appearance:none;border:1px solid rgba(255,180,59,.46);border-radius:2px;background:#130c05;color:var(--a);font:700 9px "Courier New",monospace;letter-spacing:.7px;padding:10px 4px;text-shadow:0 0 5px rgba(255,180,59,.65)}button:active{background:#2b1907;transform:translateY(1px)}.tune{display:flex;gap:5px}.tune button{flex:1;font-size:17px;padding:7px}
.footer{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding-top:5px;font-size:7px;color:var(--dim)}
#message{position:absolute;left:50%;top:47%;transform:translate(-50%,-50%);border:1px solid var(--line);background:rgba(6,3,1,.95);padding:12px 16px;font-size:9px;letter-spacing:1.5px;z-index:15;display:none;text-align:center;min-width:72%}
.ghostPulse{animation:ghostPulse 5.2s infinite}@keyframes ghostPulse{0%,47%,49%,78%,80%,100%{opacity:1}48%{opacity:.78}79%{opacity:.9}}
@media(max-height:650px){.scope{height:17vh}.water{height:10vh}.bandbar button{min-height:38px;padding:5px 2px;font-size:8px}.location{font-size:24px}}

/* v0.7 phone-first field controls */
.sub{font-size:10px;letter-spacing:1.35px;font-weight:700;color:var(--a2);opacity:.95}
.hero-tuner{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;min-height:150px;margin:4px 0 6px}
.tuning-knob{width:126px;height:126px;border-radius:50%;border:2px solid rgba(255,180,59,.72);padding:0;background:radial-gradient(circle at 38% 32%,rgba(255,210,122,.18),rgba(255,180,59,.055) 43%,#090502 72%);box-shadow:0 0 0 7px rgba(255,180,59,.04),inset 0 0 22px rgba(255,180,59,.14),0 0 18px rgba(255,145,20,.15);font-size:42px;color:var(--a2)}
.tuning-knob span{display:block;transform:translateX(3px);text-shadow:0 0 10px rgba(255,180,59,.85)}
.tuning-knob:active{transform:scale(.97);background:#241505}
.knob-label{margin-top:11px;font-size:12px;font-weight:700;letter-spacing:3px;color:var(--a2);text-shadow:0 0 7px rgba(255,180,59,.5)}
.hero-tuner.live .tuning-knob{box-shadow:0 0 0 7px rgba(255,180,59,.08),inset 0 0 28px rgba(255,180,59,.24),0 0 28px rgba(255,145,20,.28)}
.controls #listen{font-size:8px;letter-spacing:.55px;color:var(--dim)}
@media(max-height:720px){.hero-tuner{min-height:118px}.tuning-knob{width:104px;height:104px;font-size:34px}.knob-label{font-size:10px;margin-top:8px}}
</style></head>
<body>
<div id="crt"><div id="boot"></div><div id="message"></div>
<div id="radio">
<div class="top"><div><div class="brand">STARWOLF LABS // RX-14</div><div class="sub">WORLD-BAND FIELD RECEIVER // v0.7</div></div><div class="status">NEW MANILA<br>UNIT 01<br><span id="clock">--:--:--</span></div></div>
<div class="bandbar" id="bands"></div>
<div class="scope"><canvas id="spectrum"></canvas><div class="sweep"></div></div>
<div class="readout"><div class="memory" id="memory"></div><div class="location" id="location"></div><div class="station" id="station"></div><div class="signal"><span class="dot"></span><span id="sig"></span></div></div>
<canvas class="water" id="water"></canvas>
<div class="telemetry"><span id="genre"></span><span id="range"></span></div>
<div class="hero-tuner">
<button id="heroListen" class="tuning-knob" aria-label="Tune in"><span id="heroIcon">▶</span></button>
<div id="heroLabel" class="knob-label">TUNE IN</div>
</div>
<div class="controls"><button id="listen">SIGNAL STATUS</button><div class="tune"><button id="prev">◀</button><button id="next">▶</button></div><button id="scan">SCAN BANK</button></div>
<div class="footer"><span>RF FRONT END // HYBRID</span><span>PHOS // AMBER</span><span>SWL-1983</span></div>
<audio id="audio" playsinline></audio>
</div></div>
<script src="stations.js"></script>
<script>
const labels=["GHOST 1","GHOST 2","SYNTH 1","SYNTH 2","HEART BEAT 1"], displayLabels={"GHOST 1":"GHOST<br>BAND 1","GHOST 2":"GHOST<br>BAND 2","SYNTH 1":"SYNTH<br>WAVE 1","SYNTH 2":"SYNTH<br>WAVE 2","HEART BEAT 1":"HEART<br>BEAT 1"}, prefix={"GHOST 1":"B","GHOST 2":"B","SYNTH 1":"S","SYNTH 2":"S","HEART BEAT 1":"H"};
let band="GHOST 1",idx=0,playing=false; const $=id=>document.getElementById(id), audio=$("audio");
labels.forEach(b=>{let x=document.createElement("button");x.innerHTML=displayLabels[b]||b;x.onclick=()=>selectBand(b);$("bands").appendChild(x)});
function stop(){audio.pause();audio.removeAttribute("src");audio.load();playing=false;syncHero()}
function selectBand(b){stop();band=b;idx=0;document.querySelectorAll(".bandbar button").forEach((x,i)=>x.classList.toggle("active",labels[i]===b));$("crt").classList.toggle("ghostPulse",b.startsWith("GHOST"));render();flash(b.startsWith("GHOST")?"GHOST BAND // ARCHIVAL CARRIER":b+" BAND // MEMORY ONLINE")}
function render(){let s=BANKS[band][idx];$("memory").textContent=`MEMORY ${prefix[band]}${String(idx+1).padStart(2,"0")} // ${band}`;$("location").textContent=s.loc;$("station").textContent=s.name;$("genre").textContent=s.genre;$("sig").textContent=s.offline?"NO CARRIER // SEARCHING ARCHIVES":(band.startsWith("GHOST")?"AGED CARRIER // SIGNAL UNSTABLE":"CARRIER LOCKED // TRANSFER READY");$("range").textContent=s.offline?"NO CARRIER":"EXTERNAL TRANSFER"}
function flash(t){$("message").innerHTML=t+"<br><br>▓▓▓▓▓░░<br>ACQUIRING CARRIER...";$("message").style.display="block";setTimeout(()=>$("message").style.display="none",850)}
function step(n){stop();idx=(idx+n+BANKS[band].length)%BANKS[band].length;render();flash("TUNING MEMORY")}
$("prev").onclick=()=>step(-1);$("next").onclick=()=>step(1);
$("scan").onclick=()=>{stop();flash("SCANNING "+band+" BANK");setTimeout(()=>{idx=(idx+1)%BANKS[band].length;render()},650)};
const handleTune=async()=>{let s=BANKS[band][idx];if(s.offline){stop();$("sig").textContent="NO SIGNAL // SEARCHING...";flash("NO CARRIER // SCANNING VOID");return}if(playing){stop();$("sig").textContent=s.mode==="direct"?"DIRECT CARRIER // READY":"TRANSFER CARRIER // READY";return}if(s.mode==="direct"&&s.stream){$("sig").textContent="ACQUIRING SIGNAL...";flash("ACQUIRING SIGNAL...");audio.src=s.stream;audio.preload="none";try{await audio.play();playing=true;syncHero();$("sig").textContent="● SIGNAL ACQUIRED // LIVE AUDIO"}catch(e){playing=false;syncHero();$("sig").textContent="DIRECT CARRIER FAILED // TRANSFER AVAILABLE";transferFlash(["DIRECT CARRIER FAILED","STAND BY FOR TRANSFER"],()=>{if(s.url)window.location.href=s.url})}}else{transferFlash(["HANDSHAKE...","ROUTING AUDIO CARRIER...","SIGNAL ACQUIRED","STAND BY FOR TRANSFER"],()=>window.location.href=s.url)}};
function transferFlash(lines,done){let box=$("message"),i=0;box.style.display="block";function show(){box.innerHTML=lines.slice(0,i+1).join("<br><br>");i++;if(i<lines.length)setTimeout(show,420);else setTimeout(()=>{box.style.display="none";if(done)done()},600)}show();}
function syncHero(){
 const hero=document.querySelector(".hero-tuner"), icon=$("heroIcon"), label=$("heroLabel");
 if(!hero)return;
 hero.classList.toggle("live",playing);
 icon.textContent=playing?"■":"▶";
 label.textContent=playing?"END SIGNAL":"TUNE IN";
 $("heroListen").setAttribute("aria-label",playing?"End signal":"Tune in");
}
$("heroListen").onclick=()=>handleTune();
$("listen").onclick=()=>{let s=BANKS[band][idx];$("sig").textContent=playing?"● SIGNAL ACQUIRED // LIVE AUDIO":(s.mode==="direct"?"DIRECT CARRIER // READY":"TRANSFER CARRIER // READY")};
setInterval(()=>$("clock").textContent=new Date().toLocaleTimeString([],{hour12:false}),1000);

const sp=$("spectrum"),sx=sp.getContext("2d"),wa=$("water"),wx=wa.getContext("2d");let phase=0;
function resize(){[sp,wa].forEach(c=>{let r=c.getBoundingClientRect();c.width=Math.max(1,r.width*devicePixelRatio);c.height=Math.max(1,r.height*devicePixelRatio)})}addEventListener("resize",resize);
function draw(){let w=sp.width,h=sp.height;sx.clearRect(0,0,w,h);sx.strokeStyle="#ffb43b";sx.lineWidth=1.3*devicePixelRatio;sx.shadowColor="#ff9a24";sx.shadowBlur=band.startsWith("GHOST")?10:6;sx.beginPath();for(let x=0;x<w;x+=3*devicePixelRatio){let jitter=band.startsWith("GHOST")?.06:.025,energy=playing?.08:0;let base=.72+jitter*Math.sin(x*.025+phase)+jitter*Math.random()-energy*Math.abs(Math.sin(phase*3+x*.01));let strength=band==="NEON"?.5:band.startsWith("GHOST")?.34:band==="TEZETA"?.42:band==="QUANTUM"?.22:.38;let p1=strength*Math.exp(-Math.pow((x-w*.31)/(w*.025),2)),p2=(strength+.08)*Math.exp(-Math.pow((x-w*.62)/(w*.02),2)),p3=strength*.55*Math.exp(-Math.pow((x-w*.81)/(w*.04),2));let y=h*Math.max(.1,base-p1-p2-p3);x===0?sx.moveTo(x,y):sx.lineTo(x,y)}sx.stroke();phase+=playing?.075:.04;requestAnimationFrame(draw)}
function waterfall(){let w=wa.width,h=wa.height;wx.drawImage(wa,0,0,w,h,0,1*devicePixelRatio,w,h);wx.fillStyle="#070401";wx.fillRect(0,0,w,2*devicePixelRatio);for(let x=0;x<w;x+=2*devicePixelRatio){let a=.04+Math.random()*(band.startsWith("GHOST")?.2:.1)+(playing?.08:0);[.31,.62,.81].forEach(p=>a+=(band.startsWith("GHOST")?.34:.55)*Math.exp(-Math.pow((x/w-p)/.027,2)));wx.fillStyle=`rgba(255,170,45,${Math.min(.85,a)})`;wx.fillRect(x,0,2*devicePixelRatio,2*devicePixelRatio)}setTimeout(waterfall,band.startsWith("GHOST")?105:70)}
const bootLines=["STARWOLF LABORATORIES","MOBILE SIGNAL DIVISION","","RX-14 WORLD-BAND RECEIVER // v0.7","ROM CHECK..............OK","DISPLAY................OK","AUDIO BUS..............OK","MEMORY BANK............OK","ARCHIVE LINK...........OK","","LOCATION: NEW MANILA // SECTOR 03","","RESTORING SIGNAL MEMORIES...","GHOST 1.................ONLINE","GHOST 2.................ONLINE","SYNTH 1.................ONLINE","SYNTH 2.................ONLINE","HEART BEAT 1............ONLINE","","> RECEIVER READY"];let bi=0;
function bootNext(){if(bi<bootLines.length){$("boot").innerHTML+=bootLines[bi++]+"\n";setTimeout(bootNext,80+Math.random()*90)}else setTimeout(()=>{$("boot").style.display="none";$("radio").style.display="flex";resize();selectBand("GHOST 1")},450)}
$("boot").innerHTML="▮\n";setTimeout(()=>{$("boot").innerHTML="";bootNext()},300);resize();draw();waterfall();
</script></body></html>
